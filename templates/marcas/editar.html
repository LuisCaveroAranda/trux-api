{% extends 'base.html' %}
{% block title %}Editar Marca{% endblock %}
{% block page_title %}<strong>Editar marca — {{ marca.nombre }}</strong>{% endblock %}

{% block content %}
<div class="card p-4" style="max-width:400px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ marca.nombre }}" required autofocus>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'marcas' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
