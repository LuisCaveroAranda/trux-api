{% extends 'base.html' %}
{% block title %}{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor{% endblock %}
{% block page_title %}<strong>{% if proveedor %}Editar proveedor{% else %}Nuevo proveedor{% endif %}</strong>{% endblock %}

{% block content %}
<div class="card p-4" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Nombre <span class="text-danger">*</span></label>
            <input type="text" name="nombre" class="form-control" value="{{ proveedor.nombre|default:'' }}" required>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">RUC</label>
                <input type="text" name="ruc" class="form-control" value="{{ proveedor.ruc|default:'' }}" maxlength="11">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono|default:'' }}">
            </div>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control" value="{{ proveedor.email|default:'' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Persona de contacto</label>
                <input type="text" name="contacto" class="form-control" value="{{ proveedor.contacto|default:'' }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Dirección</label>
            <textarea name="direccion" class="form-control" rows="2">{{ proveedor.direccion|default:'' }}</textarea>
        </div>
        <div class="mb-4 form-check">
            <input class="form-check-input" type="checkbox" name="activo" id="activo" {% if proveedor.activo or not proveedor %}checked{% endif %}>
            <label class="form-check-label" for="activo">Activo</label>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" data-confirm="Guardar el proveedor?"><i class="bi bi-check me-1"></i>Guardar</button>
            <a href="{% url 'proveedores' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
