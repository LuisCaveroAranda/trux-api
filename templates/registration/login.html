{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar — Fuegos Artificiales TRUX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
        .brand { color: #e94560; font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: .3rem; }
        .brand-sub { color: #6c757d; text-align: center; font-size: .85rem; margin-bottom: 2rem; }
        .btn-login { background: #e94560; border: none; width: 100%; padding: .7rem; font-weight: 600; }
        .btn-login:hover { background: #c73652; }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 .2rem rgba(233,69,96,.15); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <img src="{% static 'img/logo.png' %}" alt="TRUX" style="height:80px;object-fit:contain;margin-bottom:.5rem;display:block;margin-left:auto;margin-right:auto;">
        </div>
        <div class="brand-sub">Fuegos Artificiales TRUX</div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 mb-3">
            <i class="bi bi-exclamation-circle me-1"></i> Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Tu usuario" autofocus required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login text-white">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>
        </form>
    </div>
</body>
</html>
